<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .petals-dark { fill: #0B132B; }
      .petals-accent { fill: #0066FF; }
      .gold-core { fill: #FFD700; }
      .brand-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: 0.35em;
        fill: #0B132B;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Main Monogram Group: F + Geometric Seble Flower Motif -->
  <g id="logo-mark" transform="translate(0, -20)">

    <!-- Layer 1: Base Dark Structure (Stem / Left Wall of F & Lower Petals) -->
    <!-- Central Vertical Stem of F -->
    <rect x="340" y="160" width="30" height="200" rx="4" class="petals-dark" />
    
    <!-- Outer Left Geometric Petal Arch -->
    <path d="M 340,240 
             C 270,240 240,190 270,140 
             C 300,170 320,200 340,240 Z" 
          class="petals-dark" />
    
    <!-- Outer Right Lower Geometric Petal -->
    <path d="M 370,290 
             C 440,290 470,340 440,390 
             C 410,360 390,330 370,290 Z" 
          class="petals-dark" />

    <!-- Layer 2: Electric Blue Dynamic Layers (Top & Middle Arms of 'F' / Blossoming Petals) -->
    <!-- Top Horizontal Arm of F (Styled as an Angled Blooming Petal) -->
    <path d="M 340,160 
             L 470,160 
             C 510,160 510,210 450,210 
             L 370,210 
             C 350,210 340,195 340,160 Z" 
          class="petals-accent" />
          
    <!-- Middle Horizontal Arm of F (Secondary Sharp Petal) -->
    <path d="M 370,245 
             L 450,245 
             C 480,245 480,285 430,285 
             L 370,285 Z" 
          class="petals-accent" />

    <!-- Top-Left Crest Petal (Symmetry Balance) -->
    <path d="M 340,160 
             C 340,100 390,70 420,100 
             C 390,120 370,140 340,160 Z" 
          class="petals-accent" />

    <!-- Layer 3: Gold Accent / Inner Core (Flower Center & Tech Innovation Point) -->
    <!-- Geometric Diamond Seed at the F-Cross Core -->
    <polygon points="370,210 390,228 370,246 350,228" class="gold-core" />
    
    <!-- Subtle Top Petal Gold Highlight Node -->
    <circle cx="470" cy="160" r="6" class="gold-core" />
    
  </g>

  <!-- Typography: Minimalist Tech Wordmark -->
  <text x="400" y="490" class="brand-text">FIREW</text>
  
  <!-- Subtle Architectural Alignment Dot -->
  <circle cx="400" cy="525" r="3" class="petals-accent" />
</svg>
